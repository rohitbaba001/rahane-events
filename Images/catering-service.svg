  <circle cx="185" cy="145" r="12" fill="#f0d98d"/>
  <circle cx="215" cy="145" r="12" fill="#f0d98d"/>
  
  <!-- Fork -->
  <rect x="100" y="100" width="8" height="120" rx="4" fill="#2c3e50"/>
  <rect x="95" y="95" width="4" height="30" rx="2" fill="#2c3e50"/>
