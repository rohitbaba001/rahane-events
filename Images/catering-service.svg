  <circle cx="200" cy="170" r="80" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>
  <circle cx="200" cy="170" r="70" fill="none" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Food items (stylized) -->
